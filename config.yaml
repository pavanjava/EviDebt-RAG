qdrant:
  host: localhost
  port: 6333
  api_key: th3s3cr3tk3y
  collection: hotpotqa_pooled

embedding:
  model: intfloat/e5-base-v2

generators:
  ollama:
    model: gemma3:latest
    url: http://localhost:11434/api/generate
  openai:
    model: gpt-4o-mini

dataset:
  seed: 42
  d_common_size: 200
  d_tune_size: 500

reranker:
  model: cross-encoder/ms-marco-MiniLM-L-6-v2

ab_rag:
  tau: 0.6
  k_step: 5
  t_max: 3
  weights: [0.7, 0.05, 0.25]

sure_rag:
  # deviation from doc §3.2: DeBERTa-v3-base's disentangled attention produces NaN
  # loss when fine-tuned on Apple MPS (reproducible, not a tuning issue); CPU is
  # ~340s/step and infeasible. roberta-base trains stably and is used instead.
  verifier_model: roberta-base
  seeds: [0, 1, 2]
  pairs_per_class: 1500
  aggregator_questions: 500
  k_step: 5
  t_max: 3

evidebt_rag:
  theta_s: 0.8
  theta_r: 0.4
  theta_u: 0.7
  alpha: 1.0
  beta: 1.0
  gamma: 1.0
  lambda_: 1.0
  tau_stop: 0.25
  eps_p: 0.02
  budget: 16
  kappa: 0.02
  c_ret: 1.0
  c_ver: 0.5
  retrieve_k: 5
  max_attempts: 3
  c_reform: 1.0
  c_decomp: 1.0
  c_counter: 1.0
  verifier_pairs_per_class: 1200
